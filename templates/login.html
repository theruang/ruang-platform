<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin — RUANG</title><link rel="stylesheet" href="{{ url_for('static',filename='admin.css') }}"></head><body class="loginpage"><form class="loginbox" method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="logo">RUANG<span style="color:#d42b47">.</span><small>TUMBUH BERSAMA</small></div><h1 style="margin-top:28px">Masuk Admin</h1><p>Dashboard pengelolaan website RUANG.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash error">{{m}}</div>{% endfor %}{% endwith %}<div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Kata sandi</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn" style="width:100%;padding:13px">Masuk ke Dashboard →</button><div class="smallnote">Akses hanya untuk pengelola yang telah dibuat oleh Owner.</div></form></body></html>
